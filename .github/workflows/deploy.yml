name: Deploy GatherLoop static site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Sync site content to $web container
        uses: azure/CLI@v2
        with:
          inlineScript: |
            az storage blob sync \
              --account-name "${{ secrets.AZURE_STORAGE_ACCOUNT }}" \
              --container '$web' \
              --source "site"

      - name: Purge CDN cache (skip if no CDN in use)
        if: false
        run: |
          echo "Enable this step only if fronting the storage account with Azure CDN/Front Door."

      - name: Azure logout
        run: az logout
        if: always()
